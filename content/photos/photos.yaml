# Photos. Put the image file in this folder, then add an entry. The top of the list shows first.
#
# Each photo starts with "- " on its first line; the rest of its lines are indented two spaces.
# Fields: src (required — the filename, exactly as in this folder, including the extension),
#         alt (required — describe the picture for someone who can't see it),
#         caption, date (written 2026-08-22), place — optional.
#
# Keep filenames lowercase with no spaces: the live server is case-sensitive, Windows isn't.

- src: ./intensity.jpg
  alt: Low sun through trees on the bank of the Mississippi, the light catching the branches
  caption: The setting sun shines through the trees on the bank of the Mississippi; its light sharpens what it passes by.
  date: 2026-08-22
  place: Saint Paul, MN

- src: ./selfie-g5.jpg
  alt: Selfie on a Canon PowerShot G5
  caption: Selfie on Canon powershot G5
  date: 2026-07-31
