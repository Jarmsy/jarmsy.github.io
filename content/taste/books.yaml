# Books. One entry per book; the top of the list shows first, so add new ones at the top.
# Fields: title (required), by, year, note, rating (1–5), link — all others optional.



- title: The Color of Law
  by: Richard Rothstein
  year: 2017
  note: On institutional racism and state enforced segregation post civil rights era, and its downstream effects. In high school, this book instilled a fear in me for the power of policy, and how its power must be wielded responsibly and justly.    

- title: A People's History of the United States
  by: Howard Zinn
  year: 1980
  note: This book highlights the perspectives of americans often cast aside in formal recitations of history. It expands the way I think about the US's past and present.

- title: All the Light We Cannot See
  by: Anthony Doerr
  year: 2014
  note: World War II Fiction novel that weaves the arcs of disparate teenagers divided by war so beautifully. My favorite fiction novel


