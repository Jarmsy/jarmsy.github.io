# Creators I admire — YouTube channels, podcasts, newsletters, writers, anyone
# whose work you'd point a friend to. One entry each; the top of the list shows first.
#
# Each entry starts with "- " on its first line; the rest of its lines are indented two spaces.
# Fields: title (required — the channel, show, or person's name)
#         by       what and where it is, e.g. "YouTube · video essays" or "Podcast"
#         link     the address, e.g. https://www.youtube.com/@name
#         note     why you rate them — one or two sentences
#         year     optional; rating (1–5) optional
#
# Example (remove the # from each line to use it):
# - title: Practical Engineering
#   by: YouTube · how infrastructure actually works
#   link: https://www.youtube.com/@PracticalEngineeringChannel
#   note: Grady explains dams, grids and roads the way I wish my textbooks had.

# Fill in each `note` in your own words — why you'd point a friend here.

- title: Vsauce
  by: YouTube · Michael Stevens
  link: https://www.youtube.com/@Vsauce
  note: Michael Stevens was the first person to unlock wonder in me. Through his captivating weaving of scientific specialties from what we learned about the psychology of monkeys, to the expansion of spacetime, he so beautifully demonstrates how interconnected we are to the universe. 

- title: 3Blue1Brown
  by: YouTube · Grant Sanderson, math you can see
  link: https://www.youtube.com/@3blue1brown
  note: Grant Sanderson is truly talented in his wielding of animation to demonstrate scientific proofs. I continuously return to his videos to strengthen my intuition of math, statistics, and physics. 

- title: Channel 5
  by: YouTube · Andrew Callaghan, on-the-ground reporting
  link: https://www.youtube.com/@channel5YouTube
  note: Andrew Callaghan is someone who I deeply respect for his bravery in pursuit of journalism. He not only puts himself in no man's land to interview people at the heart of issues, but will also pursue stories that threaten the interests of those with the most power to retaliate. His documentraires are a must watch if you are interested in unfiltered journalism and the realities of modern political polarization. 

- title: Good Work
  by: YouTube · Dan Toomey, business explained sideways
  link: https://www.youtube.com/@GoodWorkMB
  note: Dan Toomey and Good Work consistently put out digestible and investigative videos on "business-y" things. I love his humor and I always learn quite a lot from the videos I watch by him.  
