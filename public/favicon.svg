<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A heading bug on a compass ring. Colours follow the browser's light/dark setting. -->
  <style>
    .bg { fill: #faf7f2; } .ring { fill: none; stroke: #23201c; stroke-width: 6; } .dot { fill: #23201c; } .bug { fill: #c23b12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191613; } .ring { stroke: #ece7df; } .dot { fill: #ece7df; } .bug { fill: #ff6a3d; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="18"/>
  <circle class="ring" cx="50" cy="54" r="30"/>
  <path class="bug" d="M50 12 l10 14 h-20 z"/>
  <circle class="dot" cx="50" cy="54" r="5"/>
</svg>
