# ============================================================
# site.yaml — the settings for the whole site.
#
# Edit freely. When the site builds (or while `dev.cmd` is
# running) this file is checked, and any mistake is reported
# with the field name and what was expected.
#
# Tip: if a value contains a colon (:) or starts with a
# symbol, wrap it in quotes:  motto: "Systems: made of people"
# ============================================================

# --- Identity ------------------------------------------------
name: John Harms                  # full name — page titles, footer, CV
short_name: John                  # the wordmark in the header
motto: Systems are made of people.
corollary: ""                     # the line under the motto — leave "" to hide it
one_liner: Mechanical engineer turned policy researcher. Pilot.
portrait: portrait.jpg            # a photo of you on the front page — a filename from content/photos/, or "" for none
# A short paragraph for the front page, under the one-liner. The ">" means the
# following indented lines are one paragraph; blank it out (intro: "") to hide.
intro: >
  My approach to problems comes from working as a project engineer, student researcher,
  and pilot: leverage what I know, what I don't, and let curiosity drive where I go for
  answers. I've also found that bringing out the best in a team matters as much as my own
  performance — usually by understanding what's actually in someone's way. Policy shapes
  the structure underneath most of the problems I care about, and that's where I aim to
  apply myself now.
email: harmsyjohn@gmail.com
url: https://jarmsy.github.io   # the site's address (RSS + sitemap use it); change when you get a domain

# --- Navigation ----------------------------------------------
# Header links, in order. Any room not listed here still exists
# at its address — it's just unlisted. Remove a line to hide it.
nav:
  - { label: About,   href: /about/ }
  - { label: Writing, href: /writing/ }
  - { label: Made,    href: /made/ }
  - { label: Taste,   href: /taste/ }

# Footer links, in order.
footer:
  - { label: Now,       href: /now/ }
  - { label: Takes,     href: /takes/ }     # back to the top nav once there are five or so
  - { label: Photos,    href: /photos/ }
  # - { label: Questions, href: /questions/ }   # hidden until the questions are your own
  - { label: CV,        href: /cv/ }
  - { label: Inbox,     href: /inbox/ }
  - { label: Colophon,  href: /colophon/ }
  - { label: RSS,       href: /rss.xml }

# External profiles — shown on the About page and in the footer.
# Add, remove, reorder. Delete the examples you don't use.
links:
  - { label: Email,      href: "mailto:harmsyjohn@gmail.com" }
  - { label: GitHub,     href: https://github.com/Jarmsy }
  - { label: Letterboxd, href: https://letterboxd.com/harmsyjohn/ }
  - { label: Spotify,    href: https://open.spotify.com/user/12181509275 }
  # - { label: LinkedIn,   href: https://www.linkedin.com/in/YOUR-HANDLE/ }   # paste your profile address and remove the #

# --- Home page -----------------------------------------------
# Sections on the home page, top to bottom.
# Valid sections: now, takes, writing, made, taste, questions
# `count` = how many items to show (ignored by `now`).
home:
  - { section: now }
  - { section: takes,   count: 3 }
  - { section: writing, count: 3 }
  - { section: made,    count: 2 }

# --- Appearance ----------------------------------------------
theme:
  default: system     # system | light | dark   (what first-time visitors get)
  toggle: true        # show the light/dark switch in the header

# Colours, fonts, sizes and spacing live in src/styles/tokens.css

# --- Rooms ---------------------------------------------------
takes:
  subtitle: Robust, loosely held.
  spice: [mild, spicy, will die on this hill]   # labels for spice levels 1, 2, 3

# The inbox: a form where anyone can leave you a note, anonymously or not.
# The site is static, so notes are delivered by a form service (Formspree, free):
# create a form there and paste its endpoint URL into `action`. Each note then
# arrives by email. See README → "The inbox".
inbox:
  enabled: true
  intro: Leave me a note — a thought, a disagreement, a recommendation. Anonymous is fine. If you'd like a reply, say how to reach you.
  action: ""          # where notes are delivered, e.g. https://formspree.io/f/xxxx (blank = closed; page points to email)

dates:
  locale: en-US       # how dates are written, e.g. en-US → "July 6, 2026"

# Letterboxd: shows your most recently logged film and your highest-rated
# recent reviews on the Taste page, pulled live from your public profile.
# Leave username blank to turn this off.
letterboxd:
  username: harmsyjohn
  top_count: 3        # how many "top reviews" to show
